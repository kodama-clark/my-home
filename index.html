<section id="loginGate" class="panel"><h2>おかえりなさい</h2><p class="muted">非公開の物件ノートに接続します。次回から自動で開きます。</p><form id="loginForm"><label class="field">GitHubトークン<input id="loginToken" type="password" autocomplete="off" required placeholder="github_pat_…"></label><button type="submit">ログイン</button><p id="loginError" role="alert" class="muted"></p></form><details class="login-help"><summary>接続について</summary><p class="tiny">my-home-rankingへの読み取り権限が必要です。アプリから編集を保存する場合はContentsをRead and writeにしてください。認証情報はこの端末に保存します。</p></details></section>
<div id="privateApp" class="hidden"><div id="syncBar" class="statusbar"><div class="row"><span id="syncText" aria-live="polite"></span><button id="syncButton" class="plain" data-action="sync">今すぐ更新</button></div><div id="pendingText" class="tiny"></div></div><nav class="nav" aria-label="メインメニュー"><button data-nav="rank">一覧</button><button data-nav="new">新着</button><button data-nav="favorites">お気に入り</button><button data-nav="compare">比較</button><button data-nav="settings">設定</button></nav><div id="content"></div></div><input id="importFile" type="file" accept=".json,application/json" class="hidden"><div id="toast" class="toast hidden" role="status" aria-live="polite"></div></main><script>const VERSION = '4.0.3';
const CACHE_KEY = 'my-home-state-v4';
const TOKEN_KEY = 'home-read-token';
const API = 'https://api.github.com/repos/kodama-clark/my-home-ranking/contents/data/listings.json';
const clone = v => JSON.parse(JSON.stringify(v));
const same = (a,b) => JSON.stringify(a??null) === JSON.stringify(b??null);
const validUrl = s => {try {const u=new URL(s); return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}};
const number = s => s===''||s==null||!Number.isFinite(Number(s))?null:Number(s);
const now = () => new Date().toISOString();
function normalize(h){
 if(!h||typeof h!=='object'||!String(h.id||'').trim()||!String(h.name||'').trim())return null;
 for(const k of ['sources','manualFields','revisionHistory','researchUpdates'])if(h[k]!=null&&(!Array.isArray(h[k])||h[k].some(v=>k==='manualFields'?typeof v!=='string':!v||typeof v!=='object')))return null;
 if(h.visitChecks!=null&&(typeof h.visitChecks!=='object'||Array.isArray(h.visitChecks)))return null;
 const out={...h,id:String(h.id),name:String(h.name)};
 for(const k of ['price','walk','landArea','buildingArea','fees'])if(out[k]!=null)out[k]=String(out[k]);
 return out;
}
function parseData(raw){
 if(!raw||!Array.isArray(raw.homes))throw Error('物件データの形式を確認できませんでした。保存データは変更していません。');
 const seen=new Set();const homes=raw.homes.map(normalize);
 if(homes.some(h=>!h||seen.has(h.id)||!seen.add(h.id)))throw Error('物件IDの重複または必須項目の不足があります。');
 return {...raw,homes};
}
function emptyState(){return {schema:4,homes:[],pending:{},meta:{},lastSync:'',migrationComplete:false};}
function points(h){
 const p=number(h.price),w=number(h.walk),r=parseInt(h.rooms,10);
 const detail=[['価格',20,p==null?null:p<=3500?20:p<=3800?18:p<=4000?15:p<=4200?11:p<=4500?6:p<=5000?2:0],['交通',15,w==null?null:w<=7?15:w<=10?13:w<=15?10:w<=20?4:0],['ハザード',20,({safe:20,minor:12,medium:4,high:0})[h.hazard]??null],['坂道',10,({flat:10,gentle:7,steep:2,stairs:0})[h.slope]??null],['子育て',15,({good:15,ok:9,bad:2})[h.child]??null],['買い物',10,({good:10,ok:6,bad:1})[h.shops]??null],['建物',5,!Number.isFinite(r)||!h.building?null:(r>=4?3:r>=3?2:0)+(h.building==='新築2階建て'?2:h.building==='新築3階建て'?1:0)],['資産価値',5,({good:5,ok:3,bad:0})[h.asset]??null]];
 const max=detail.reduce((s,x)=>s+(x[2]===null?0:x[1]),0),earned=detail.reduce((s,x)=>s+(x[2]??0),0);
 return {total:max?Math.round(earned/max*100):null,max,earned,detail};
}
function isLeasehold(h){return ['leasehold','fixed_term_leasehold'].includes(h.landTenure)||h.landTenure==='借地権';}
function inHistory(h){return h.archived===true||['sold','withdrawn','group'].includes(h.listingStatus)||isLeasehold(h);}
function tenure(h){return ({ownership:'所有権',leasehold:'借地権',fixed_term_leasehold:'定期借地権'})[h.landTenure]||'権利未確認';}
function statusLabel(h){return h.archived?'見送り':({sold:'成約済み',withdrawn:'掲載終了',group:'分譲地の元資料',listed:'掲載確認済み',unverified:'販売状況未確認'})[h.listingStatus]||'販売状況未確認';}
function requirementNotes(h){const out=[];if(number(h.price)>5000)out.push('物件価格が予算上限を超過');if(number(h.walk)>15)out.push('駅徒歩15分を超過');if(h.rooms&&parseInt(h.rooms,10)<3)out.push('居室3室未満（納戸は別）');if(h.building==='新築3階建て')out.push('3階建て');if(h.landTenure!=='ownership')out.push(tenure(h));if(number(h.price)!=null&&number(h.fees)==null)out.push('諸費用未確認');return out;}
function canonicalUrl(s){const v=validUrl(s);if(!v)return '';const u=new URL(v);u.hash='';for(const k of [...u.searchParams.keys()])if(/^(utm_|fbclid|gclid)/.test(k))u.searchParams.delete(k);return u.href.replace(/\/$/,'');}
function filterHomes(homes,f={}){
 return homes.filter(h=>f.view==='history'?inHistory(h):!inHistory(h)).filter(h=>f.view!=='favorites'||h.favorite).filter(h=>!f.q||[h.name,h.address,h.station,h.memo,h.userMemo].some(v=>String(v||'').toLowerCase().includes(f.q.toLowerCase()))).filter(h=>{
  for(const [key,limit]of [['price',f.budget],['walk',f.walk]])if(limit){const n=number(h[key]);if(n==null?!f.unknown:n>Number(limit))return false;}
  if(f.rooms){const n=parseInt(h.rooms,10);if(!n?!f.unknown:n<Number(f.rooms))return false;}return true;
 }).sort((a,b)=>f.sort==='new'?String(b.created||'').localeCompare(String(a.created||'')):f.sort==='price'?(number(a.price)??Infinity)-(number(b.price)??Infinity):f.sort==='coverage'?points(b).max-points(a).max:(points(b).total??-1)-(points(a).total??-1)||points(b).max-points(a).max);
}
function enqueue(state,id,changes){
 const old=state.homes.find(h=>h.id===id);const patch={};
 for(const [k,v]of Object.entries(changes))if(!['id','__proto__','constructor','prototype'].includes(k)&&!same(old?.[k],v))patch[k]=clone(v);
 if(!Object.keys(patch).length)return state;
 const pending=state.pending[id]||{base:{},changes:{},rev:0,isNew:!old};
 for(const k of Object.keys(patch))if(!(k in pending.base))pending.base[k]=old?.[k]??null;
 const manualFields=[...new Set([...(old?.manualFields||[]),...Object.keys(patch).filter(k=>!['created','source','updated','favorite','visitChecks','archived'].includes(k))])];
 const entry={...pending,changes:{...pending.changes,...patch,manualFields,updated:now()},rev:pending.rev+1};
 const home={...old,...entry.changes,id};
 return {...state,homes:old?state.homes.map(h=>h.id===id?home:h):[home,...state.homes],pending:{...state.pending,[id]:entry}};
}
function receive(state,remote){
 const data=parseData(remote);const ids=new Set(data.homes.map(h=>h.id));
 const homes=data.homes.map(h=>({...h,...(state.pending[h.id]?.changes||{})}));
 for(const h of state.homes)if(!ids.has(h.id)&&state.pending[h.id])homes.push(h);
 const {homes:unused,...meta}=data;return {...state,homes,meta,lastSync:now()};
}
class ConflictError extends Error{constructor(conflicts){super('別の端末・更新と同じ項目が変更されています。内容を確認してください。');this.conflicts=conflicts;}}
function mergePending(remote,pending){
 const data=clone(parseData(remote)),conflicts=[];
 for(const[id,e]of Object.entries(pending)){
  const i=data.homes.findIndex(h=>h.id===id),r=data.homes[i];
  if(!r&&!e.isNew){conflicts.push({id,field:'record',remote:null,local:e.changes});continue;}
  for(const[k,v]of Object.entries(e.changes)){
   if(['updated','manualFields'].includes(k))continue;
   if(r&&!same(r[k],e.base[k])&&!same(r[k],v))conflicts.push({id,field:k,remote:r[k]??null,local:v});
  }
  const h={...r,...e.changes,id,manualFields:[...new Set([...(r?.manualFields||[]),...(e.changes.manualFields||[])])]};
  if(i>=0)data.homes[i]=h;else data.homes.push(h);
 }
 if(conflicts.length)throw new ConflictError(conflicts);
 data.updated=now();return data;
}
function acknowledge(state,sent,remote){
 const pending=clone(state.pending);
 for(const[id,e]of Object.entries(sent))if(pending[id]?.rev===e.rev)delete pending[id];else if(pending[id]){
  const r=remote.homes.find(h=>h.id===id);
  for(const k of Object.keys(pending[id].changes)){
   if(same(pending[id].changes[k],e.changes[k])){delete pending[id].changes[k];delete pending[id].base[k];}
   else pending[id].base[k]=r?.[k]??null;
  }
  pending[id].isNew=false;
 }
 return receive({...state,pending},remote);
}
function base64Encode(text){const bytes=new TextEncoder().encode(text);let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s);}
function base64Decode(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));}
function httpError(status){return Object.assign(Error(status===401?'認証期限切れです。設定からトークンを更新してください。':status===403?'GitHubが操作を拒否しました。書き込み権限またはAPIの利用上限を確認してください。':status===404?'保存先が見つかりません。トークンの対象リポジトリを確認してください。':`通信エラー（HTTP ${status}）`),{status});}
class GitHubStore{
 constructor(token,fetcher=(...args)=>globalThis.fetch(...args)){this.token=token;this.fetcher=fetcher;}
 async request(method,body){const r=await this.fetcher(API+(method==='GET'?'?ref=main&t='+Date.now():''),{method,headers:{Authorization:'Bearer '+this.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},cache:'no-store',...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(25000)});if(!r.ok)throw httpError(r.status);return r.json();}
 async read(){const file=await this.request('GET');return {data:parseData(JSON.parse(base64Decode(file.content))),sha:file.sha};}
 async write(pending){for(let attempt=0;attempt<3;attempt++){
  const {data,sha}=await this.read(),next=mergePending(data,pending);
  try{await this.request('PUT',{message:'Save home edits from app',branch:'main',sha,content:base64Encode(JSON.stringify(next,null,2)+'\n')});return next;}
  catch(e){if(e.status!==409||attempt===2)throw e;}
 }}
}


const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readJSON=(storage,k,fallback)=>{try{return JSON.parse(storage.getItem(k))??fallback;}catch{return fallback;}};
let state=readJSON(localStorage,CACHE_KEY,emptyState());
if(!state||!Array.isArray(state.homes)||!state.pending)state=emptyState();
let page='rank',listMode='rank',selected='',pageNumber=1,comparison=new Set(),busy=false,syncRequested=false,conflicts=[],syncMessage='まだ同期していません',syncError=false,editBase=null,installPrompt=null;
const filters={q:'',budget:'',walk:'',rooms:'',unknown:true,sort:'score'};
const PAGE_SIZE=10;
const labels={name:'物件名',address:'所在地',station:'最寄駅',price:'物件価格',walk:'駅徒歩',rooms:'間取り',building:'建物',landArea:'土地面積',buildingArea:'建物面積',fees:'諸費用',landTenure:'土地の権利',listingStatus:'販売状況',memo:'調査・評価メモ',userMemo:'自分のメモ',url:'物件URL',hazard:'ハザード',hazardNote:'ハザード調査の詳細',hazardUrl:'ハザード資料URL',hazardCheckedAt:'ハザード確認日',slope:'坂道',slopeNote:'駅からのルート・坂道',child:'子育て',childNote:'学校・保育園',shops:'買い物',shopsNote:'買い物・医療',asset:'資産価値',assetNote:'資産価値の根拠',researchUrl:'生活環境の資料URL',researchCheckedAt:'生活環境の確認日'};

function migrate(remote){
 let next=receive(state,remote);
 if(!next.migrationComplete){
  const notes=readJSON(localStorage,'my-home-personal-notes-v1',{}),old=readJSON(sessionStorage,'my-home-ranking-private-session-v2',[]),favorites=new Set(readJSON(localStorage,'my-home-favorites-v1',[]));
  for(const h of old)if(h?.id&&h?.name&&!next.homes.some(x=>x.id===h.id))next=enqueue(next,h.id,h);
  for(const h of [...next.homes]){const n=notes[h.id];if(n&&typeof n==='object')next=enqueue(next,h.id,n);if(favorites.has(h.id))next=enqueue(next,h.id,{favorite:true});}
  next.migrationComplete=true;
 }
 return next;
}
async function sync(){
 const token=localStorage.getItem(TOKEN_KEY);if(!token)return;if(busy){syncRequested=true;return;}
 busy=true;renderStatus();
 try{
  const store=new GitHubStore(token);
  if(!state.migrationComplete){const remote=await store.read();persist(migrate(remote.data));}
  let sentCount=0;
  for(let i=0;i<3&&Object.keys(state.pending).length;i++){
   const sent=clone(state.pending),remote=await store.write(sent);sentCount+=Object.keys(sent).length;persist(acknowledge(state,sent,remote));
  }
  const remote=await store.read();const before=new Set(state.homes.map(h=>h.id));persist(receive(state,remote.data));conflicts=[];
  const added=state.homes.filter(h=>!before.has(h.id)).length;
  setStatus(`${sentCount?sentCount+'件をGitHubに保存。':''}登録 ${state.homes.length}件${added?'・新規 '+added+'件':''}を同期しました`);
 }catch(e){
  if(e instanceof ConflictError){conflicts=e.conflicts;setStatus('編集の競合があります。「設定」で保存する内容を選んでください。',true);}
  else setStatus((Object.keys(state.pending).length?'端末保存済み／GitHub保存待ち：':'同期できませんでした：')+(e.name==='TimeoutError'?'通信がタイムアウトしました。':e.message),true);
 }finally{busy=false;renderStatus();if(page!=='edit')render();if(syncRequested){syncRequested=false;queueMicrotask(sync);}}
}

  if(!String(name||'').trim())throw Error('物件名を入力してください。');
  for(const k of ['price','walk','fees','landArea','buildingArea'])if(changes[k]!==undefined&&changes[k]!==''&&(number(changes[k])==null||Number(changes[k])<0))throw Error('価格・徒歩・面積は0以上の数字で入力してください。');
  for(const k of ['url','hazardUrl','researchUrl'])if(changes[k]&&!validUrl(changes[k]))throw Error('URLはhttpまたはhttpsから入力してください。');
  const url=changes.url??editBase.url;if(url&&state.homes.some(x=>x.id!==id&&canonicalUrl(x.url)===canonicalUrl(url)))throw Error('このURLは登録済みです。同じ分譲地の別号棟なら、URLを空欄にして物件名に号棟を入れて登録してください。');
  // Compare against the form's opening state so background edits cannot silently win.
  if(existing)for(const k of Object.keys(changes))if(!same(existing[k]??'',editBase[k]??'')&&!same(existing[k],changes[k]))throw Error('編集中にデータが変わりました。一度戻って最新情報を確認してください。');
  if(!existing)Object.assign(changes,{created:now(),source:'manual',name});queuePatch(id,changes);go('detail',id);notify('端末に保存しました。GitHubへ同期します。');sync();
 }catch(e){error.textContent=e.message;error.classList.remove('hidden');}
 });}
function renderCompare(){const hs=[...comparison].map(findHome).filter(Boolean);const rows=[['物件',h=>h.name],['価格',h=>money(h.price)],['諸費用込み',h=>number(h.price)!=null&&number(h.fees)!=null?money(Number(h.price)+Number(h.fees)):'未確認'],['最寄駅',h=>value(h.station)],['徒歩',h=>value(h.walk,'分')],['間取り',h=>value(h.rooms)],['建物',h=>value(h.building)],['土地 / 建物',h=>value(h.landArea,'㎡')+' / '+value(h.buildingArea,'㎡')],['権利',tenure],['状況',statusLabel],['ハザード',h=>ratings[h.hazard]||'未確認'],['坂道',h=>ratings[h.slope]||'未確認'],['学校・保育園',h=>h.childNote||'未確認'],['買い物',h=>h.shopsNote||'未確認'],['暫定点',h=>(points(h).total??'—')+' / 情報充足'+points(h).max+'%'],['自分のメモ',h=>h.userMemo||'未入力']];return `<div class="row viewtitle"><h2>物件を比較 (${hs.length}/3)</h2>${button('compare-clear','選択解除')}</div>${hs.length?'<div class="scrolltable"><table><tbody>'+rows.map(([l,fn])=>'<tr><th scope="row">'+esc(l)+'</th>'+hs.map(h=>'<td class="pre">'+esc(fn(h))+'</td>').join('')+'</tr>').join('')+'<tr><th>詳細</th>'+hs.map(h=>'<td>'+button('detail','詳細を見る',h.id)+button('compare-toggle','外す',h.id)+'</td>').join('')+'</tr></tbody></table></div>':'<div class="empty">一覧の「＋ 比較」で、最大3件を選んでください。</div>'}<p class="tiny">表は横にスクロールできます。未確認は安全・高評価を意味しません。</p>${button('back','一覧へ戻る')}`;}
function renderSettings(){const collection=state.meta.collection;return `<h2 class="viewtitle">設定・保存状況</h2><section class="panel"><h3>同期</h3><p>${Object.keys(state.pending).length}件の未送信編集 / 登録${state.homes.length}件</p><p class="tiny">${esc(syncMessage)}</p><div class="actions">${button('sync','今すぐ同期','','')}${button('export','バックアップを保存')}${button('import','バックアップを読み込む')}</div><p class="tiny">読み込みは既存物件と統合します。元のデータを一括削除しません。</p></section>
 ${conflicts.length?'<section class="panel"><h3>競合した編集を確認</h3><p class="tiny">同じ項目が別の場所で更新されています。保存する内容を選んでください。</p>'+[...new Set(conflicts.map(c=>c.id))].map(id=>`<div class="conflict"><strong>${esc(findHome(id)?.name||id)}</strong>${conflicts.filter(c=>c.id===id).map(c=>`<p class="pre">${esc(labels[c.field]||c.field)}<br>GitHub：${esc(typeof c.remote==='object'?JSON.stringify(c.remote):c.remote)}<br>この端末：${esc(typeof c.local==='object'?JSON.stringify(c.local):c.local)}</p>`).join('')}<div class="actions">${button('resolve-local','この端末の編集を保存',id)}${button('resolve-remote','GitHubの内容を使う',id)}</div></div>`).join('')+'</section>':''}
 <section class="panel"><h3>物件情報の更新</h3><p>${esc(collection?.description||'物件の定期検索はまだ設定されていません。')}</p><p class="tiny">${collection?.lastRun?'最終調査 '+esc(dateText(collection.lastRun)):''}${collection?.lastResult?' / '+esc(collection.lastResult):''}</p><p class="tiny">「今すぐ更新」は登録済みデータの同期です。新着物件の調査とは別です。販売終了を確認できない物件は、推測で成約済みに変更しません。</p></section>
 <section class="panel"><h3>接続を更新</h3><p class="muted">保存先：非公開の my-home-ranking</p><p class="tiny">書き込みには、このリポジトリのContentsを「Read and write」にしたトークンが必要です。既存トークンはそのまま引き継ぎます。</p><form id="tokenForm"><label class="field">新しいGitHubトークン<input type="password" autocomplete="off" required placeholder="github_pat_…"></label><button type="submit">接続を更新</button><p role="alert" class="muted"></p></form></section>
 <section class="panel"><h3>この端末</h3><p class="tiny">ログイン情報・物件・未送信の編集はこのブラウザに保存されます。ログアウト後も、未送信データは消しません。</p><div class="actions">${button('logout','ログアウト')}${button('clear-device','端末の保存データを削除','','danger')}${installPrompt?button('install','ホーム画面に追加'):''}</div><p class="tiny">Android Chromeのメニューからも「ホーム画面に追加」ができます。</p></section><p class="footer">My Home Ranking v${VERSION}・物件情報は非公開リポジトリに保存</p>`;}
function resolve(id,useLocal){const next=clone(state),e=next.pending[id];if(!e)return;for(const c of conflicts.filter(x=>x.id===id)){
 if(c.field==='record'){if(useLocal)e.isNew=true;else{delete next.pending[id];next.homes=next.homes.filter(h=>h.id!==id);}continue;}
 if(useLocal)e.base[c.field]=c.remote;else{delete e.changes[c.field];delete e.base[c.field];const h=next.homes.find(h=>h.id===id);if(h)h[c.field]=c.remote;}
 }if(next.pending[id])next.pending[id].rev++;persist(next);conflicts=conflicts.filter(x=>x.id!==id);render();sync();}
function exportData(){const blob=new Blob([JSON.stringify({app:'my-home-ranking',version:4,...state.meta,homes:state.homes,pending:state.pending},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-home-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
async function importData(file){if(!file)return;try{if(file.size>10000000)throw Error('10MB以下のJSONを選んでください。');const raw=JSON.parse(await file.text()),data=parseData(Array.isArray(raw)?{homes:raw}:raw);if(!confirm(`${data.homes.length}件を統合します。同じIDの項目は読み込む内容に更新し、他の物件は残します。`))return;let next=state;for(const h of data.homes)next=enqueue(next,h.id,h);persist(next);go('rank');notify('読み込みました。同期します。');sync();}catch(e){notify('読み込み失敗：'+e.message);}finally{$('importFile').value='';}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){if(page==='edit'&&!confirm('編集中の入力を閉じますか？'))return;go(nav.dataset.nav);return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,h=findHome(id);try{
 if(a==='detail')go('detail',id);else if(a==='edit')go('edit',id);else if(a==='add')go('edit');else if(a==='back')go(listMode);else if(a==='cancel-edit')go(selected?'detail':listMode,selected);else if(a==='history')go('history');else if(a==='favorite'&&h){queuePatch(id,{favorite:!h.favorite});render();sync();}else if(a==='compare-toggle'){if(comparison.has(id))comparison.delete(id);else if(comparison.size<3)comparison.add(id);else{notify('比較は3件までです。比較画面から物件を外してください。');return;}render();notify(`比較 ${comparison.size}/3件`);}else if(a==='compare-clear'){comparison.clear();render();}else if(a==='archive'&&h){queuePatch(id,{archived:!h.archived});go('detail',id);sync();}else if(a==='prev'||a==='next'){pageNumber+=a==='next'?1:-1;render();window.scrollTo(0,0);}else if(a==='clear-filter'){Object.assign(filters,{q:'',budget:'',walk:'',rooms:'',unknown:true,sort:'score'});pageNumber=1;render();}else if(a==='sync')sync();else if(a==='export')exportData();else if(a==='import')$('importFile').click();else if(a==='logout')logout();else if(a==='resolve-local'||a==='resolve-remote')resolve(id,a==='resolve-local');else if(a==='clear-device'){if(Object.keys(state.pending).length){notify('未送信の編集があります。先に同期するかバックアップを保存してください。');return;}if(confirm('この端末のログイン情報と保存データを削除します。GitHubの物件データは残ります。よろしいですか？')){[CACHE_KEY,TOKEN_KEY,'my-home-personal-notes-v1','my-home-favorites-v1','my-home-visit-checks-v1'].forEach(k=>localStorage.removeItem(k));sessionStorage.removeItem('my-home-ranking-private-session-v2');state=emptyState();logout();}}else if(a==='install'&&installPrompt){installPrompt.prompt();installPrompt=null;}
 }catch(err){notify(err.message);}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const input=e.target,position=input.selectionStart;filters.q=input.value;pageNumber=1;clearTimeout(renderList.timer);renderList.timer=setTimeout(()=>{render();$('search')?.focus();try{$('search')?.setSelectionRange(position,position);}catch{}},180);}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.filter){filters[t.dataset.filter]=t.value;pageNumber=1;render();$('filterDetails').open=true;}else if(t.id==='includeUnknown'||t.id==='sortSelect'){if(t.id==='includeUnknown')filters.unknown=t.checked;else{filters.sort=t.value;if(listMode==='new')listMode='rank';}pageNumber=1;render();$('filterDetails').open=true;}else if(t.dataset.visit!==undefined){const h=findHome(t.dataset.id);if(h){try{queuePatch(h.id,{visitChecks:{...(h.visitChecks||{}),[t.dataset.visit]:t.checked}});sync();}catch(e){notify(e.message);t.checked=!t.checked;}}}else if(t.id==='importFile')importData(t.files[0]);});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'||e.target.id==='tokenForm')login(e);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&page!=='edit')sync();});
window.addEventListener('online',sync);
window.addEventListener('storage',e=>{if(e.key===CACHE_KEY){const next=readJSON(localStorage,CACHE_KEY,null);if(next?.homes&&next.pending){state=next;if(page!=='edit')render();}}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(page==='settings')render();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});}
$('version').textContent='v'+VERSION;
render();if(localStorage.getItem(TOKEN_KEY)){showPrivate();sync();}

</script></body></html>
